# ============================================================================
# TrueSight - Agent Windows : fichier de configuration d'exemple
# ----------------------------------------------------------------------------
# Copier ce fichier sous C:\ProgramData\TrueSight\config.ini en production
# (il est poussé par GPO). En développement, le placer dans le dossier courant.
# ============================================================================

[server]
# URL de base du serveur TrueSight (HTTPS obligatoire en production).
url = https://parc.medicofi.fr
# Secret d'enrôlement partagé, échangé une seule fois contre un token unique.
enrollment_token = <shared secret>
# Vérification du certificat TLS. Mettre à false UNIQUEMENT en développement.
verify_tls = true

[agent]
# Intervalle (secondes) entre deux heartbeats (métriques live).
heartbeat_interval = 45
# Intervalle (secondes) entre deux interrogations de la file de commandes.
command_poll_interval = 8
# Intervalle (heures) entre deux collectes d'inventaire matériel + logiciel.
inventory_interval_hours = 12

# Prise de main ÉLEVÉE : la session de bureau à distance tourne dans un processus
# SYSTEM plutôt qu'avec les droits de la personne connectée. C'est ce qui permet
# de CLIQUER dans une fenêtre élevée (invite UAC, installeur, ajout d'imprimante)
# — Windows interdit à un processus d'injecter une entrée dans une fenêtre de
# niveau d'intégrité supérieur.
#
# ACTIVÉ par défaut : ne le passer à false que pour exclure délibérément un poste.
# remote_elevated = true

# Terminal distant exécuté avec les droits SYSTEM (défaut : true).
# terminal_system = true

# Prise de main possible sans session Windows ouverte (écran de connexion,
# poste verrouillé), via un helper SYSTEM attaché au bureau d'entrée (défaut : true).
# remote_unattended = true
